<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cobros - NEXTREP</title>
    <link rel="stylesheet" href="/cobros.css">
</head>
<body>
<body>

<header class="encabezado">
    <h1>NEXTREP</h1>
    <p>Gestor Inteligente de Negocios</p>
</header>

<h2 class="titulo-pagina">
    Gestión de Cobros
</h2>

<div class="menu">
    
    <button class="menu-btn">☰</button>

    <div class="menu-content">
        <a href="http://127.0.0.1:5001/panel">🏠 Menú principal</a>
        <a href="http://127.0.0.1:5001/">📊 Ventas</a>
        <a href="http://127.0.0.1:5002/">💰 Cobros</a>
        <a href="http://127.0.0.1:5000/">📉 Gastos y Costos</a>
        <a href="http://127.0.0.1:5001/perfil">👤 Perfil</a>
        <a href="http://127.0.0.1:5001/login">🚪 Cerrar sesión</a>
    </div>
</div>
    <main class="contenedor">
        <h1>Gestión de Cobros</h1>
        <p>Registra y consulta los cobros de tu negocio.</p>

        <form id="formCobros">
            <input type="hidden" id="cobroId">

            <label for="cliente">Cliente</label>
            <input type="text" id="cliente" required>

            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" required>

            <label for="valor">Valor del cobro</label>
            <input type="number" id="valor" min="1" step="0.01" required>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>

            <label for="estado">Estado</label>
            <select id="estado" required>
                <option value="Pendiente">Pendiente</option>
                <option value="Pagado">Pagado</option>
            </select>

            <button type="submit" id="btnGuardar">Registrar cobro</button>
            <button type="button" id="btnCancelar">Limpiar formulario</button>
        </form>

        <p id="mensaje"></p>

        <h2>Historial de cobros</h2>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Descripción</th>
                        <th>Valor</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCobros"></tbody>
            </table>
        </div>
    </main>

    <script src="/cobros.js"></script>
</body>
</html>
