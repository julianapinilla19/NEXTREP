
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | NEXTREP</title>
    <link rel="stylesheet" href="/registro/registro.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta">
            <h1>NEXTREP</h1>
            <p class="subtitulo">
                Gestiona tu negocio de forma inteligente
            </p>

            <h2>Crear cuenta</h2>
            <p class="descripcion">
                Regístrate para comenzar a gestionar tu negocio.
            </p>

            <form id="formulario-registro">
                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre"
                    autocomplete="name"
                    required
                    minlength="2"
                >

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="tucorreo@ejemplo.com"
                    autocomplete="email"
                    required
                >

                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Mínimo 8 caracteres"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirmar-contrasena">
                    Confirmar contraseña
                </label>
                <input
                    type="password"
                    id="confirmar-contrasena"
                    name="confirmar-contrasena"
                    placeholder="Escribe nuevamente tu contraseña"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <p id="mensaje" role="alert" aria-live="polite"></p>

                <button type="submit" id="boton-registro">
                    Crear cuenta
                </button>
            </form>

            <p class="enlace">
                ¿Ya tienes una cuenta?
                <a href="/login">Iniciar sesión</a>
            </p>
        </section>
    </main>

    <script src="/registro/registro.js"></script>
</body>
</html>
