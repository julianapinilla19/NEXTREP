
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXTREP - Gastos y Costos</title>
    <link rel="stylesheet" href="/gastos.css">
</head>
<body>
    <header>
        <h1>NEXTREP</h1>
        <p>Gestión de gastos y costos</p>
    </header>

    <main class="contenedor">
        <section class="card">
            <h2>Registrar gasto</h2>

            <form id="formGasto">
                <label for="descripcionGasto">Descripción</label>
                <input id="descripcionGasto" type="text"
                       placeholder="Ej: Pago de servicios" required>

                <label for="categoriaGasto">Categoría</label>
                <select id="categoriaGasto" required>
                    <option value="">Seleccionar categoría</option>
                    <option>Servicios</option>
                    <option>Personal</option>
                    <option>Mantenimiento</option>
                    <option>Publicidad</option>
                    <option>Otros</option>
                </select>

                <label for="valorGasto">Valor (COP)</label>
                <input id="valorGasto" type="number"
                       min="0.01" step="0.01" required>

                <label for="fechaGasto">Fecha</label>
                <input id="fechaGasto" type="date" required>

                <button id="btnGasto" type="submit">
                    Registrar gasto
                </button>
                <button id="cancelarGasto" type="button"
                        class="secundario oculto">
                    Cancelar edición
                </button>
            </form>

            <h3>Lista de gastos</h3>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Descripción</th>
                            <th>Categoría</th>
                            <th>Valor</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaGastos"></tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <h2>Registrar costo</h2>

            <form id="formCosto">
                <label for="descripcionCosto">Descripción</label>
                <input id="descripcionCosto" type="text"
                       placeholder="Ej: Compra de materiales" required>

                <label for="tipoCosto">Tipo de costo</label>
                <select id="tipoCosto" required>
                    <option value="">Seleccionar tipo</option>
                    <option>Producto</option>
                    <option>Material</option>
                    <option>Operación</option>
                    <option>Otro</option>
                </select>

                <label for="valorCosto">Valor (COP)</label>
                <input id="valorCosto" type="number"
                       min="0.01" step="0.01" required>

                <label for="fechaCosto">Fecha</label>
                <input id="fechaCosto" type="date" required>

                <button id="btnCosto" type="submit">
                    Registrar costo
                </button>
                <button id="cancelarCosto" type="button"
                        class="secundario oculto">
                    Cancelar edición
                </button>
            </form>

            <h3>Lista de costos</h3>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Descripción</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaCostos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/gastos.js"></script>
</body>
</html>
