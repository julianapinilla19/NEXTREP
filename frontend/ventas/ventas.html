
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXTREP - Ventas</title>
    <link rel="stylesheet" href="ventas.css">
</head>

<body>
    <h1>NEXTREP</h1>
    <h2>Registro de Ventas</h2>

    <!-- Formulario para registrar una venta -->
    <div class="formulario">
        <label for="producto">Producto:</label>
        <input type="text" id="producto" placeholder="Nombre del producto">

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" placeholder="Cantidad">

        <label for="precio">Precio:</label>
        <input type="number" id="precio" placeholder="Precio">

        <button onclick="registrarVenta()">Registrar Venta</button>
    </div>

    <hr>

    <!-- Filtro por fechas -->
    <h2>Historial de Ventas</h2>

    <div class="filtros">
        <label for="fechaDesde">Desde:</label>
        <input type="date" id="fechaDesde">

        <label for="fechaHasta">Hasta:</label>
        <input type="date" id="fechaHasta">

        <button onclick="consultarHistorial()">Consultar</button>
        <button onclick="limpiarFiltro()">Ver todas</button>
    </div>

    <!-- Total de ventas -->
    <h3>Total vendido en el período:</h3>
    <p id="totalVentas">$0</p>

    <!-- Tabla de ventas -->
    <h2>Lista de Ventas</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio unitario</th>
                <th>Total</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="listaVentas">
        </tbody>
    </table>

    <script src="ventas.js"></script>
</body>
</html>
